services:
  worker:
    image: myoung34/github-runner:ubuntu-focal
    environment:
      ACCESS_TOKEN: null
      EPHEMERAL: 1
      REPO_URL: https://github.com/danielmajoinen/rocknix
      RUNNER_NAME: rocknix-runner
      RUNNER_WORKDIR: /tmp/runner/work
      CONFIGURED_ACTIONS_RUNNER_FILES_DIR: /runner/data # Required for persistence
      RUNNER_SCOPE: 'repo'
      LABELS: self-hosted,arm64,no-gpu
      DISABLE_AUTOMATIC_DEREGISTRATION: true
    security_opt:
      - label:disable # needed on SELinux systems to allow docker container to manage other docker containers
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock'
      - runner_data:/runner/data # required for persistence
      - '/tmp/runner:/tmp/runner'
      # note: a quirk of docker-in-docker is that this path
      # needs to be the same path on host and inside the container,
      # docker mgmt cmds run outside of docker but expect the paths from within

volumes:
  runner_data:
